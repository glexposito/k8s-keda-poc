# Static CoreDNS override so prod's pods can resolve "azurite" and the
# internal/stg API servers by name - Docker's own embedded DNS (which
# resolves these from a container's own shell) doesn't reach inside a
# pod's separate network namespace, so CoreDNS needs its own mapping.
# This can be plain, git-committed YAML - unlike a Docker-assigned
# address, every hostname below has a fixed IP in docker-compose.yaml
# (azurite: 172.28.0.100, internal: 172.28.0.101, stg: 172.28.0.102),
# so there's nothing to discover at runtime.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  azurite.override: |
    template IN A {
      match "^azurite\."
      answer "{{ .Name }} 60 IN A 172.28.0.100"
      fallthrough
    }
  internal.override: |
    template IN A {
      match "^k3s-internal\."
      answer "{{ .Name }} 60 IN A 172.28.0.101"
      fallthrough
    }
  stg.override: |
    template IN A {
      match "^k3s-stg\."
      answer "{{ .Name }} 60 IN A 172.28.0.102"
      fallthrough
    }
