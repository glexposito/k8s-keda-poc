# prod is the final promotion step - full production traffic, highest
# quota tier for core-workers (see README "Namespace design
# rationale"). `argocd` is a separate, fixed platform namespace - not a
# workload tenant - reserved for Argo CD, installed there by
# scripts/bootstrap-argocd.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: core-workers
  labels:
    environment: prod
    stage: prod
    cost-center: cc-2000
    managed-by: k8s-keda-poc
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    environment: prod
    stage: prod
    cost-center: cc-1000
    managed-by: k8s-keda-poc
