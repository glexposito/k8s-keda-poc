# prod is the final promotion step - full production traffic, highest
# quota tier for core-workers. Argo CD itself lives on the dedicated
# management cluster (manifests/management/), not here - prod is a plain
# workload tenant like internal/stg now.
apiVersion: v1
kind: Namespace
metadata:
  name: core-workers
  labels:
    environment: prod
    stage: prod
    cost-center: cc-2000
    managed-by: k8s-keda-poc
