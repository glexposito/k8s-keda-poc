# prod is the final promotion step - full production traffic, highest
# quota tier for core-workers (see README "Namespace design
# rationale"). `chaos-prod` is a separate, fixed platform namespace - not
# a workload tenant - reserved for Argo CD once it's installed on this
# cluster (see docs/argocd-setup.md); it predates and is independent of
# the pillar model this repo used to have, which is why it kept its name
# even after pillars were dropped.
apiVersion: v1
kind: Namespace
metadata:
  name: core-workers
  labels:
    environment: prod
    stage: prod
    cost-center: cc-2000
    managed-by: k8s-keda-poc
---
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-prod
  labels:
    environment: prod
    stage: prod
    cost-center: cc-1000
    managed-by: k8s-keda-poc
