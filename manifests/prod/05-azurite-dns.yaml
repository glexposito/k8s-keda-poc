# Static CoreDNS override so pods can resolve "azurite" by name - Docker's
# own embedded DNS (which resolves "azurite" from a container's own shell)
# doesn't reach inside a pod's separate network namespace, so CoreDNS needs
# its own mapping. This can be plain, git-committed YAML because azurite
# has a fixed IP in docker-compose.yaml (172.28.0.100), not a
# Docker-assigned one - there's nothing to discover.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  azurite.override: |
    template IN A {
      match "^azurite\."
      answer "{{ .Name }} 60 IN A 172.28.0.100"
      fallthrough
    }
