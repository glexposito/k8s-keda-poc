# Static CoreDNS override so pods can resolve "azurite" by name - Docker's
# own embedded DNS (which resolves "azurite" from a container's own shell)
# doesn't reach inside a pod's separate network namespace, so CoreDNS needs
# its own mapping. This can be plain, git-committed YAML here (unlike the
# cross-cluster k3s hostnames scripts/bootstrap-argocd.sh has to bridge at
# runtime) because azurite has a fixed IP in docker-compose.yaml
# (172.28.0.100), not a Docker-assigned one - there's nothing to discover.
#
# This coredns-custom ConfigMap is shared with scripts/bootstrap-argocd.sh
# on this cluster, which later adds internal.override/stg.override keys
# via `kubectl patch --type merge` (JSON Merge Patch merges by key, so it
# doesn't disturb the azurite.override key this file owns - see the
# matching comment in that script for why a plain `apply` would be unsafe
# here).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  azurite.override: |
    template IN A {
      match "^azurite\."
      answer "{{ .Name }} 60 IN A 172.28.0.100"
      fallthrough
    }
