# Per-namespace governance: caps resource usage and isolates namespaces
# from each other at the network layer. k3s enables its kube-router
# network policy controller by default, so these NetworkPolicies are
# actually enforced (not just descriptive). KEDA scales both worker1 and
# worker2 between 0 and maxReplicaCount: 20 here (see
# charts/core-workers/values-prod.yaml), so 40 pods (both workers at their
# ceiling at once) is the real worst case - this quota covers that plus
# rollout headroom - the largest tier of any cluster, since it carries
# full production traffic.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: core-workers-quota
  namespace: core-workers
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 3Gi
    limits.cpu: "6"
    limits.memory: 6Gi
    pods: "48"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: core-workers
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-only
  namespace: core-workers
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
