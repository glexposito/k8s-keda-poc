# Per-namespace governance: caps resource usage and isolates namespaces
# from each other at the network layer. k3s enables its kube-router
# network policy controller by default, so these NetworkPolicies are
# actually enforced (not just descriptive). KEDA scales both worker1 and
# worker2 between 0 and maxReplicaCount: 5 here (see
# charts/core-workers/values-internal.yaml), so 10 pods (both workers at
# their ceiling at once) is the real worst case - this quota covers that
# plus rollout headroom - the smallest tier of any cluster, since internal
# is the lowest-risk environment.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: core-workers-quota
  namespace: core-workers
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "12"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: core-workers
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-only
  namespace: core-workers
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
