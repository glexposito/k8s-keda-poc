# Per-namespace governance: caps resource usage and isolates namespaces
# from each other at the network layer. k3s enables its kube-router
# network policy controller by default, so these NetworkPolicies are
# actually enforced (not just descriptive). internal runs
# replicaCount: 1 (see charts/core-workers/values-internal.yaml), so this
# quota is generous headroom above that floor, not a tight fit - the
# smallest tier of any cluster, since internal is the lowest-risk
# environment.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: core-workers-quota
  namespace: core-workers
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: core-workers
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-only
  namespace: core-workers
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
