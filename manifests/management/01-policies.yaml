# Same governance pattern as every other cluster (see
# manifests/<cluster>/01-policies.yaml): a quota/limit ceiling plus a
# default-deny-except-same-namespace NetworkPolicy, sized to comfortably
# hold Argo CD's own components - unrelated to core-workers, since this
# cluster never runs that workload.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-quota
  namespace: argocd
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: argocd
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-only
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
