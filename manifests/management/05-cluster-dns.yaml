# Static CoreDNS override so Argo CD's own pods (argocd-server,
# argocd-repo-server, argocd-application-controller) can resolve
# internal/stg/prod's API servers by hostname - Docker's own embedded DNS
# (which resolves these from a container's own shell) doesn't reach
# inside a pod's separate network namespace, so CoreDNS needs its own
# mapping. This can be plain, git-committed YAML because every hostname
# below has a fixed IP in docker-compose.yaml (internal: 172.28.0.101,
# stg: 172.28.0.102, prod: 172.28.0.103) - nothing to discover at
# runtime. No azurite entry here - this cluster never talks to it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  internal.override: |
    template IN A {
      match "^k3s-internal\."
      answer "{{ .Name }} 60 IN A 172.28.0.101"
      fallthrough
    }
  stg.override: |
    template IN A {
      match "^k3s-stg\."
      answer "{{ .Name }} 60 IN A 172.28.0.102"
      fallthrough
    }
  prod.override: |
    template IN A {
      match "^k3s-prod\."
      answer "{{ .Name }} 60 IN A 172.28.0.103"
      fallthrough
    }
