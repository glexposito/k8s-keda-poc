# Per-namespace governance: caps resource usage and isolates namespaces
# from each other at the network layer. k3s enables its kube-router
# network policy controller by default, so these NetworkPolicies are
# actually enforced (not just descriptive). KEDA scales all 10 workers
# between 0 and maxReplicaCount: 10 here (see
# charts/core-workers/values-stg.yaml), so 100 pods (all ten workers at
# their ceiling at once) is the real worst case - this quota covers that
# plus rollout headroom. internal/stg/prod/management are four k3s
# containers sharing one physical host (64GB/20 threads on the dev box
# this was sized for), not four machines with their own capacity, so
# these caps stay under worst case to leave headroom for the other
# clusters and the host itself - stg is customer-facing, a notch below
# prod.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: core-workers-quota
  namespace: core-workers
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "120"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: core-workers
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-only
  namespace: core-workers
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
