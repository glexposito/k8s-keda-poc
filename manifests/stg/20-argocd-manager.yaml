# ServiceAccount Argo CD (running in the prod cluster's argocd
# namespace) authenticates as when it manages this cluster remotely.
# cluster-admin is used here for PoC simplicity - a real deployment would
# scope this down to just the namespaces/resources Argo CD actually needs.
#
# The token below can't be handed to Argo CD by dropping a static file in
# manifests/prod/ - every cluster generates fresh, independent credentials
# on every boot, so bridging this token into prod's Argo CD as a registered
# cluster is a one-time script, not something k3s's auto-apply can do.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-manager-role-binding
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-manager-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: argocd-manager
type: kubernetes.io/service-account-token
