# Installs KEDA (the operator + CRDs that power core-workers' ScaledObjects)
# via its official Helm chart, once per cluster that actually runs
# core-workers - KEDA is a cluster-scoped operator, so each of internal/
# stg/prod needs its own instance. management doesn't appear here: it
# never runs core-workers, so it has no need for KEDA. project: platform,
# same as clusters-appset.yaml, since installing an operator with its own
# CRDs is cluster-scoped governance, not a product-pillar workload.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: keda-appset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: internal
            server: https://k3s-internal:6443
          - cluster: stg
            server: https://k3s-stg:6443
          - cluster: prod
            server: https://k3s-prod:6443
  template:
    metadata:
      name: 'keda-{{cluster}}'
      namespace: argocd
      labels:
        environment: '{{cluster}}'
        layer: governance
    spec:
      project: platform
      source:
        repoURL: https://kedacore.github.io/charts
        chart: keda
        targetRevision: 2.20.2
      destination:
        server: '{{server}}'
        namespace: keda
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # KEDA's scaledjobs.keda.sh CRD is genuinely huge (~650KB as
          # YAML - it embeds a full Kubernetes JobSpec/PodTemplateSpec
          # schema alongside all the same trigger schema
          # scaledobjects.keda.sh has). Client-side apply's
          # kubectl.kubernetes.io/last-applied-configuration annotation
          # blows past Kubernetes' 262144-byte annotation limit trying to
          # embed that whole object - confirmed via keda-prod's actual
          # sync error ("metadata.annotations: Too long").
          - ServerSideApply=true
          # KNOWN LIMITATION, not fully resolved: even with
          # ServerSideApply=true above, this Argo CD version (v3.5.2)
          # still fails the exact same way applying scaledjobs.keda.sh
          # specifically - confirmed live that plain `kubectl apply
          # --server-side` outside Argo CD succeeds instantly on the
          # identical manifest, so the CRD itself isn't the problem, Argo
          # CD's own apply path is. Worked around by applying that one
          # CRD directly with kubectl on all three clusters as a one-time
          # manual step; keda-*'s Applications will likely show
          # perpetual OutOfSync/retry-failed for just that one resource
          # as a result. This doesn't affect functionality - this repo
          # only ever creates ScaledObject resources (see
          # charts/core-workers/templates/scaledobject.yaml), never
          # ScaledJob, and scaledobjects.keda.sh installs and syncs
          # cleanly on its own.
