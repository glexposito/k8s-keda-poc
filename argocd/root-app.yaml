# App-of-apps bootstrap: the one Application applied manually (by
# scripts/bootstrap-argocd.sh), pointing at this argocd/ directory itself.
# Once this exists, the other GitOps manifests here (the ApplicationSets and
# AppProjects, and whatever the ApplicationSets generate) are picked up and
# synced automatically - no further manual kubectl apply needed.
# helmchart.yaml is excluded because K3s manages the Argo CD installation.
#
# directory.recurse is required: Argo CD's directory source is
# non-recursive by default, so without it argocd/projects/*.yaml would be
# silently ignored - confirmed by root showing Synced/Degraded with the
# AppProjects entirely absent from its managed-resources list, while the
# ApplicationSets' attempts to point child Applications at those
# (nonexistent) projects silently failed too, leaving them stuck on
# "default".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  labels:
    layer: bootstrap
spec:
  project: default
  source:
    repoURL: https://github.com/glexposito/k8s-keda-poc.git
    targetRevision: HEAD
    path: argocd
    directory:
      recurse: true
      exclude: helmchart.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
