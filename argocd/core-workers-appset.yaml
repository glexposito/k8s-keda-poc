# Deploys both core-worker variants (apps/core-workers, same Kustomize
# base, same image) into their shared namespace on each of the three
# clusters - a matrix generator crosses every stage with every worker, so
# this stays one appset regardless of how many workers or environments
# exist. The stage comes from git (apps/core-workers/overlays/<stage>:
# APP_ENV plus the KEDA scaling rules); the worker identity is added here
# per Application (name suffix + instance label), since worker1 and worker2
# are otherwise identical. Requires KEDA already installed on each cluster
# - see argocd/keda-appset.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-workers-appset
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - stage: internal
                  server: https://k3s-internal:6443
                - stage: stg
                  server: https://k3s-stg:6443
                - stage: prod
                  server: https://k3s-prod:6443
          - list:
              elements:
                - worker: worker1
                - worker: worker2
  template:
    metadata:
      # The Application name needs both {{worker}} and {{stage}} - all six
      # Applications live together in argocd, so their names have to
      # be unique from each other, unlike the shared namespace they each
      # deploy into on separate clusters.
      name: 'core-workers-{{worker}}-{{stage}}'
      namespace: argocd
      labels:
        stage: '{{stage}}'
        environment: '{{stage}}'
        worker: '{{worker}}'
    spec:
      project: core-workers
      source:
        repoURL: https://github.com/glexposito/k8s-keda-poc.git
        targetRevision: HEAD
        path: 'apps/core-workers/overlays/{{stage}}'
        kustomize:
          # Keeps worker1's and worker2's objects apart within the one
          # shared namespace (core-workers-worker1, core-workers-worker2,
          # azurite-connection-worker1, ...). Each worker gets its own
          # Secret even though the content is identical - a shared one
          # would be owned by two Applications, which Argo CD fights over.
          nameSuffix: '-{{worker}}'
          # Also added to the Deployment/Service selectors, so each
          # worker's Service only targets its own pods.
          commonLabels:
            app.kubernetes.io/instance: '{{worker}}'
      destination:
        server: '{{server}}'
        namespace: 'core-workers'
      # Without this, selfHeal would reset spec.replicas back to
      # base/deployment.yaml's static replicas on every sync, fighting the
      # HPA that base/scaledobject.yaml's ScaledObject creates - Argo CD
      # would "correct" KEDA's scaling decision away every time it
      # reconciles.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
