# Deploys both core-worker variants (charts/core-workers, same chart, same
# image) into their shared namespace on each of the three clusters - a
# matrix generator crosses every stage with every worker, so this stays
# one appset regardless of how many workers or environments exist.
# worker1/worker2 differ only by values-<worker>.yaml (QUEUE_NAME) layered
# on top of values-<stage>.yaml (APP_ENV plus the KEDA scaling.* rules -
# messages-per-replica and the min/max ceiling differ per environment, not
# per worker) on top of values.yaml (shared defaults). Requires KEDA
# already installed on each cluster - see argocd/keda-appset.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-workers-appset
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - stage: internal
                  server: https://k3s-internal:6443
                - stage: stg
                  server: https://k3s-stg:6443
                - stage: prod
                  server: https://kubernetes.default.svc
          - list:
              elements:
                - worker: worker1
                - worker: worker2
  template:
    metadata:
      # The Application name needs both {{worker}} and {{stage}} - all six
      # Applications live together in argocd, so their names have to
      # be unique from each other, unlike the shared namespace they each
      # deploy into on separate clusters.
      name: 'core-workers-{{worker}}-{{stage}}'
      namespace: argocd
      labels:
        stage: '{{stage}}'
        environment: '{{stage}}'
        worker: '{{worker}}'
    spec:
      project: core-workers
      source:
        repoURL: https://github.com/glexposito/k8s-keda-poc.git
        targetRevision: HEAD
        path: charts/core-workers
        helm:
          # releaseName drives the chart's common.fullname (Release.Name),
          # so this is what actually keeps worker1's and worker2's
          # Deployment/Service names apart within the one shared namespace
          # on each cluster - without it, Argo CD would default the
          # release name to the Application name above instead. No
          # core-workers- prefix needed here (unlike the Application name
          # below): Kubernetes uniqueness is (namespace, kind, name), and
          # "worker1"/"worker2" are already unique within the core-workers
          # namespace on their own - repeating the namespace's own name
          # inside each object's name would just be redundant.
          releaseName: '{{worker}}'
          valueFiles:
            - values.yaml
            - 'values-{{stage}}.yaml'
            - 'values-{{worker}}.yaml'
      destination:
        server: '{{server}}'
        namespace: 'core-workers'
      # Without this, selfHeal would reset spec.replicas back to
      # values.yaml's static replicaCount on every sync, fighting the HPA
      # that templates/scaledobject.yaml's ScaledObject creates - Argo CD
      # would "correct" KEDA's scaling decision away every time it
      # reconciles.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
