# core-workers: the single workload this repo runs, restricted to its own
# namespaces across all three clusters, no cluster-scoped access at all -
# a bad/malicious Application trying to touch another namespace, or
# create a ClusterRole, would be rejected by Argo CD before it ever
# touches the cluster.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: core-workers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: core-workers - owns the core-workers namespace on each cluster only.
  sourceRepos:
    - https://github.com/glexposito/k8s-keda-poc.git
  destinations:
    - server: https://k3s-internal:6443
      namespace: 'core-workers'
    - server: https://k3s-stg:6443
      namespace: 'core-workers'
    - server: https://kubernetes.default.svc
      namespace: 'core-workers'
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
    - group: ''
      kind: Service
    - group: ''
      kind: Pod
    - group: ''
      kind: Secret
    # KEDA's ScaledObject - the chart's actual autoscaling rule (see
    # templates/scaledobject.yaml). TriggerAuthentication isn't used here
    # (connectionFromEnv reads the Secret above directly off this
    # Deployment's own pod spec instead), so it's not whitelisted.
    - group: keda.sh
      kind: ScaledObject
