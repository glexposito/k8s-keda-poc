# 1 replica per 25 messages, more responsive than internal, less than
# prod.
- op: test                      # stop the build if trigger 0 isn't azure-queue
  path: /spec/triggers/0/type
  value: azure-queue
- op: replace
  path: /spec/maxReplicaCount
  value: 10
- op: replace
  path: /spec/triggers/0/metadata/queueLength
  value: "25"
