# 1 replica per 10 messages, most responsive and highest ceiling of any
# environment - prod carries full production traffic.
- op: test                      # stop the build if trigger 0 isn't azure-queue
  path: /spec/triggers/0/type
  value: azure-queue
- op: replace
  path: /spec/maxReplicaCount
  value: 20
- op: replace
  path: /spec/triggers/0/metadata/queueLength
  value: "10"
