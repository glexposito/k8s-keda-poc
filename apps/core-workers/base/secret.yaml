# Suffixed per worker (azurite-connection-<worker>, see
# argocd/core-workers-appset.yaml) even though worker1's and worker2's
# content is identical - a single shared Secret would be "owned" by two different
# Applications at once (core-workers-worker1-<stage> and
# core-workers-worker2-<stage>), which Argo CD would flag as a shared
# resource and fight over on prune/delete.
#
# Azurite's fixed, publicly-documented local development account -
# identical on every Azurite install everywhere, not a real secret. Pods
# resolve "azurite" via each cluster's CoreDNS override
# (manifests/<cluster>/05-azurite-dns.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: azurite-connection
type: Opaque
stringData:
  connectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;"
