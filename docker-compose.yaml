services:
  internal:
    image: docker.io/rancher/k3s:v1.36.2-k3s1
    container_name: k3s-internal
    hostname: k3s-internal
    privileged: true

    command:
      - server
      - --node-name=internal
      - --tls-san=localhost
      - --tls-san=k3s-internal

    ports:
      - "6444:6443"

    volumes:
      - internal-data:/var/lib/rancher/k3s
      - ./manifests/internal:/var/lib/rancher/k3s/server/manifests/custom:ro

    networks:
      - k8s-management

  stg:
    image: docker.io/rancher/k3s:v1.36.2-k3s1
    container_name: k3s-stg
    hostname: k3s-stg
    privileged: true

    command:
      - server
      - --node-name=stg
      - --tls-san=localhost
      - --tls-san=k3s-stg

    ports:
      - "6446:6443"

    volumes:
      - stg-data:/var/lib/rancher/k3s
      - ./manifests/stg:/var/lib/rancher/k3s/server/manifests/custom:ro

    networks:
      - k8s-management

  prod:
    image: docker.io/rancher/k3s:v1.36.2-k3s1
    container_name: k3s-prod
    hostname: k3s-prod
    privileged: true

    command:
      - server
      - --node-name=prod
      - --tls-san=localhost
      - --tls-san=k3s-prod

    ports:
      - "6445:6443"
      - "9000:9000"   # Argo CD UI, exposed by scripts/argocd-ui.sh

    volumes:
      - prod-data:/var/lib/rancher/k3s
      - ./manifests/prod:/var/lib/rancher/k3s/server/manifests/custom:ro
      - ./argocd/helmchart.yaml:/var/lib/rancher/k3s/server/manifests/argocd-helmchart.yaml:ro

    networks:
      - k8s-management

  # Local Azure Storage Queue emulator - there's no real Azure account
  # here, Azurite is Microsoft's official emulator and speaks the same
  # Queue Storage API. Queue-only (azurite-queue), since blob/table aren't
  # used by this repo.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite
    hostname: azurite

    command:
      - azurite-queue
      - --queueHost=0.0.0.0
      - --queuePort=10001
      - --location=/data

    ports:
      - "10001:10001"

    volumes:
      - azurite-data:/data

    networks:
      k8s-management:
        # Fixed, not Docker-assigned - this is what lets every cluster's
        # CoreDNS override for "azurite" (manifests/<cluster>/05-azurite-dns.yaml)
        # be a static, git-committed value instead of something a
        # bootstrap script has to discover at runtime via `docker inspect`.
        ipv4_address: 172.28.0.100

  # One-shot: creates core-workers-queue and seeds it with 100 messages,
  # so there's something for a future KEDA ScaledObject to scale on. Only
  # seeds on first creation (checks the `created` field from `queue
  # create`) - azurite-data persists across `docker compose up -d`
  # restarts, so without that check this would keep appending 100 more
  # messages every time the stack comes back up.
  queue-seed:
    image: mcr.microsoft.com/azure-cli:latest
    container_name: queue-seed
    depends_on:
      - azurite

    environment:
      # Azurite's fixed, publicly-documented local development account -
      # identical on every Azurite install everywhere, not a real secret.
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;"

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for azurite..."
        until az storage queue exists --name core-workers-queue -o none 2>/dev/null; do sleep 1; done
        CREATED=$$(az storage queue create --name core-workers-queue --query created -o tsv)
        if [ "$$CREATED" = "true" ]; then
          echo "Seeding 100 messages into core-workers-queue..."
          for i in $$(seq 1 100); do
            az storage message put --queue-name core-workers-queue --content "message-$$i" -o none
          done
          echo "Done."
        else
          echo "core-workers-queue already exists - skipping seed."
        fi

    networks:
      - k8s-management

volumes:
  internal-data:
  stg-data:
  prod-data:
  azurite-data:

networks:
  k8s-management:
    driver: bridge
    # A defined subnet is required to assign azurite a static IP above -
    # Docker won't let you pin an address on a network with no IPAM
    # config. Every other container on this network still gets a
    # Docker-assigned address as before.
    ipam:
      config:
        - subnet: 172.28.0.0/24
