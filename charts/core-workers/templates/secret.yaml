# Named per-release ({{ include "common.fullname" . }}-azurite-connection,
# not a fixed name) even though worker1's and worker2's content is
# identical - a fixed name would make this one Secret object "owned" by
# two different Applications at once (core-workers-worker1-<stage> and
# core-workers-worker2-<stage>), which Argo CD would flag as a shared
# resource and fight over on prune/delete.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.fullname" . }}-azurite-connection
  labels:
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
  connectionString: {{ .Values.azuriteConnectionString | quote }}
